{{- if .Values.storageService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.storageService.name }}
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-service
spec:
  replicas: {{ .Values.storageService.replicaCount }}
  selector:
    matchLabels:
      {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: storage-service
  template:
    metadata:
      labels:
        {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storage-service
    spec:
      {{- if and .Values.postgres.enabled (eq .Values.storageService.env.STORAGE_BACKEND "postgres") }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.postgres.name }} {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done;']
      {{- end }}
      containers:
      - name: storage-service
        image: {{ include "elastic-gpu-telemetry.image" (dict "Values" .Values "image" .Values.storageService.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.storageService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.storageService.service.port }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.storageService.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.storageService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.storageService.name }}
  labels:
    {{- include "elastic-gpu-telemetry.serviceLabels" (dict "component" "storage-service" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: {{ .Values.storageService.service.type }}
  ports:
    - port: {{ .Values.storageService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage-service
{{- end }}

