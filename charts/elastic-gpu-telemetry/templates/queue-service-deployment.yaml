{{- if .Values.queueService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.queueService.name }}
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue-service
spec:
  replicas: {{ .Values.queueService.replicaCount }}
  selector:
    matchLabels:
      {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: queue-service
  template:
    metadata:
      labels:
        {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: queue-service
    spec:
      containers:
      - name: queue-service
        image: {{ include "elastic-gpu-telemetry.image" (dict "Values" .Values "image" .Values.queueService.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.queueService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.queueService.service.port }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.queueService.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.queueService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.queueService.name }}
  labels:
    {{- include "elastic-gpu-telemetry.serviceLabels" (dict "component" "queue-service" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: {{ .Values.queueService.service.type }}
  ports:
    - port: {{ .Values.queueService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elastic-gpu-telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: queue-service
{{- end }}

