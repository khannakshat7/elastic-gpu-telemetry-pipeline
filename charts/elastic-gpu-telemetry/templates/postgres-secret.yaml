{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.name }}-secret
  labels:
    {{- include "elastic-gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  postgres-password: {{ .Values.postgres.auth.password | b64enc | quote }}
  postgres-user: {{ .Values.postgres.auth.username | b64enc | quote }}
  postgres-db: {{ .Values.postgres.auth.database | b64enc | quote }}
{{- end }}

